<script>
const icon=(name)=>`<svg fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><use href="#${name}"/></svg>`;
const parents=[['数据看板','chart'],['课程管理','book'],['集体研学管理','chart'],['活动管理','flag'],['学校管理','school'],['基地管理','grid'],['机构管理','shield'],['作品管理','image']];
const reports=['报表汇总','托管活动评价明细','作业明细','量化评价明细','绑定明细','开展课程明细','证书明细','校级报表','活动报表','营期班级统计'];

const activities=[
{id:1,serviceOrganization:'启航研学机构',name:'秋季托管劳动实践活动',date:'2026-11-12',schools:[{name:'驻马店市实验小学',evaluated:128,unevaluated:12},{name:'驻马店市第二小学',evaluated:96,unevaluated:8},{name:'驻马店市第三小学',evaluated:108,unevaluated:10}]},
{id:2,serviceOrganization:'青少年素质教育基地',name:'课后托管趣味运动会',date:'2026-11-10',schools:[{name:'驻马店市实验小学',evaluated:86,unevaluated:6},{name:'驻马店市第二小学',evaluated:102,unevaluated:12}]},
{id:3,serviceOrganization:'知行教育机构',name:'托管阅读分享活动',date:'2026-11-06',schools:[{name:'驻马店市第三小学',evaluated:75,unevaluated:5}]},
{id:4,serviceOrganization:'劳动实践基地',name:'校园手工创作活动',date:'2026-10-28',schools:[{name:'驻马店市实验小学',evaluated:90,unevaluated:10},{name:'驻马店市第三小学',evaluated:82,unevaluated:8}]}];
const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const params=new URLSearchParams(location.search);const activityId=Number(params.get('activity')||1);const activity=activities.find(a=>a.id===activityId);
document.querySelectorAll('[data-report]').forEach(el=>el.onclick=()=>location.href='index.html');document.querySelectorAll('[data-other]').forEach(el=>el.onclick=()=>{});
document.querySelector('#report-toggle').onclick=()=>document.querySelector('.submenu').classList.toggle('hidden');document.querySelector('.collapse').onclick=()=>document.body.classList.toggle('compact');
document.querySelector('#breadcrumb').innerHTML='<a class="back-link" href="index.html">托管活动评价明细</a> / 活动评价详情';document.title='活动评价详情 · 教育局管理平台';
const selectField=(id,label,values)=>`<label class="field"><span>${label}：</span><select id="${id}"><option value="">全部${label}</option>${values.map(x=>`<option>${x}</option>`).join('')}</select></label>`;
const schoolNames=activity?activity.schools.map(s=>s.name):[];
const tree=(score)=>[
{name:'活动参与',mode:'star',score,children:[{name:'参与态度',mode:'star',score:4},{name:'任务完成',mode:'score',points:50,maxPoints:100}]},
{name:'实践能力',mode:'score',points:80,maxPoints:100},
{name:'合作表现',mode:'star',score:4}
];
const records=schoolNames.flatMap((school,i)=>[{name:['张同学','李同学','王同学'][i]||'陈同学',school,districtBureau:i===0?'驿城区教育局':'',activityName:activity.name,activityComment:'积极参与本次活动，能与同学合作完成任务，实践能力有所提升。',year:'2026~2027',term:'上学期',grade:'三年级',className:'1班',indicators:tree(5)},{name:['刘同学','赵同学','陈同学'][i]||'周同学',school,districtBureau:i===0?'驿城区教育局':'',activityName:activity.name,activityComment:'能认真完成本次活动任务，建议今后更加主动地交流和分享。',year:'2026~2027',term:'上学期',grade:'四年级',className:'2班',indicators:tree(4)}]);
function flattenIndicators(nodes){return nodes.flatMap(n=>[{...n,depth:0},...(n.children||[]).map(child=>({...child,depth:1}))])}
function filterRecords(school,year,term,grade,className){return records.filter(r=>r.school.includes(school)&&(!year||r.year===year)&&(!term||r.term===term)&&(!grade||r.grade===grade)&&(!className||r.className===className))}
function renderDetail(){document.querySelector('#filter-top').innerHTML='<div class="detail-context"><a class="back-link" href="index.html">← 返回列表</a><span>'+escapeHtml(activity?.name||'活动不存在')+'</span></div>';document.querySelector('#filters').innerHTML='<div class="activity-filters"><label class="field"><span>学校名称：</span><input type="search" id="detail-school" list="detail-school-options" placeholder="请选择学校，支持模糊搜索"></label><datalist id="detail-school-options">'+schoolNames.map(name=>'<option value="'+escapeHtml(name)+'"></option>').join('')+'</datalist>'+selectField('detail-year','学年',['2026~2027','2025~2026'])+selectField('detail-term','学期',['上学期','下学期'])+selectField('detail-grade','年级',['一年级','二年级','三年级','四年级','五年级','六年级'])+selectField('detail-class','班级',['1班','2班','3班','4班'])+'</div>';document.querySelector('#list-title').innerHTML='学生评价明细<span class="demo-tag">示例数据</span>';document.querySelector('#export').disabled=false;queryDetail()}
function renderRating(indicator){const isScore=indicator.mode==='score';const stars=isScore?indicator.points/indicator.maxPoints*5:indicator.score;return `<div class="rating"><span class="rating-caption">${isScore?'分值':'星评'}</span><div class="rating-line"><span class="stars" role="img" aria-label="${isScore?indicator.points+'分，满分'+indicator.maxPoints+'分':indicator.score+'星，满分5星'}">${Array.from({length:5},(_,j)=>{const fill=Math.max(0,Math.min(1,stars-j))*100;return `<span aria-hidden="true" style="background:linear-gradient(90deg,#ffb325 ${fill}%,#dcdfe6 ${fill}%);background-clip:text;-webkit-background-clip:text;color:transparent">★</span>`}).join('')}</span>${isScore?`<span class="rating-label">（${indicator.points}分）</span>`:''}</div></div>`}
function queryDetail(){const rows=filterRecords(...['school','year','term','grade','class'].map(x=>document.querySelector('#detail-'+x).value.trim()));document.querySelector('#table').innerHTML='<table class="student-table"><thead><tr><th>学生姓名</th><th>学校名称</th><th>年级</th><th>班级</th><th>区县教育局</th><th>活动名称</th><th>操作</th></tr></thead><tbody>'+(rows.length?rows.map(r=>`<tr><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.school)}</td><td>${escapeHtml(r.grade)}</td><td>${escapeHtml(r.className)}</td><td>${escapeHtml(r.districtBureau?.trim()||'- -')}</td><td>${escapeHtml(r.activityName)}</td><td><button class="link-btn" data-student-detail="${records.indexOf(r)}">查看详情</button></td></tr>`).join(''):'<tr><td colspan="7" class="empty-cell">暂无符合筛选条件的学生评价</td></tr>')+'</tbody></table>';document.querySelector('#total').textContent='共 '+rows.length+' 条学生数据'}
function openStudentDetail(index){const record=records[index];if(!record)return;const indicators=flattenIndicators(record.indicators);document.querySelector('#evaluation-content').innerHTML=`<div class="evaluation-summary"><strong>${escapeHtml(record.name)}</strong><span>${escapeHtml(record.school)}</span><span>${escapeHtml(record.grade)} · ${escapeHtml(record.className)}</span><div class="evaluation-activity">活动名称：${escapeHtml(record.activityName)}</div></div><table class="evaluation-table"><thead><tr><th>评价指标</th><th>评价结果</th></tr></thead><tbody>${indicators.map(n=>`<tr><td><div class="indicator ${n.depth===0?'indicator-root':''}" style="--depth:${n.depth}"><span class="level-badge">${n.depth+1}级指标</span>${escapeHtml(n.name)}</div></td><td>${renderRating(n)}</td></tr>`).join('')}</tbody></table><section class="activity-comment"><h3>活动评语</h3><p>${escapeHtml(record.activityComment||'—')}</p></section>`;document.querySelector('#evaluation-dialog').showModal()}
document.querySelector('#table').onclick=e=>{const button=e.target.closest('[data-student-detail]');if(button)openStudentDetail(Number(button.dataset.studentDetail))};
document.querySelectorAll('[data-close-evaluation]').forEach(button=>button.onclick=()=>document.querySelector('#evaluation-dialog').close());
function exportStudentList(){const rows=filterRecords(...['school','year','term','grade','class'].map(x=>document.querySelector('#detail-'+x).value.trim()));const values=[['学生姓名','学校名称','年级','班级','区县教育局','活动名称'],...rows.map(r=>[r.name,r.school,r.grade,r.className,r.districtBureau?.trim()||'- -',r.activityName])];const csv='\uFEFF'+values.map(row=>row.map(value=>'"'+String(value).replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='学生活动评价明细.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.querySelector('#export').onclick=exportStudentList;
document.querySelector('#query').onclick=queryDetail;document.querySelector('#reset').onclick=renderDetail;document.querySelector('#filters').addEventListener('keydown',e=>{if(e.key==='Enter')queryDetail()});renderDetail();
</script></body></html>
